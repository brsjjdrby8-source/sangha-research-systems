[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sangha-field-geometry"
version = "0.1.0"
description = "Typed field geometry and clustered moment estimation"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "scipy>=1.14,<2"]
[project.scripts]
sangha-geometry = "sangha_geometry.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
